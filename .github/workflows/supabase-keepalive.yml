name: Manter Supabase ativo

# O plano gratuito do Supabase põe o projeto em pausa ao fim de 7 dias sem uso.
# Este fluxo faz um pedido simples à base de dados de 3 em 3 dias para isso não acontecer.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedido ao Supabase
        env:
          SUPABASE_URL: https://hqnvhmifwemlibuqzyfu.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxbnZobWlmd2VtbGlidXF6eWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODQyNzMsImV4cCI6MjEwMTk2MDI3M30.B3GbDW2E0Kj887I4z9P24A9Hv0ffmCO2np9waN5LQCk
        run: |
          curl -sS -o /dev/null -w "auth: %{http_code}\n" "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY"
          curl -sS -o /dev/null -w "db: %{http_code}\n" "$SUPABASE_URL/rest/v1/app_state?select=user_id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
